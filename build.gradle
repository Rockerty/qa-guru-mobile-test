plugins {
    id 'java-library'
    id 'io.qameta.allure' version '3.0.2'
}

repositories {
    mavenCentral()
}

def aspectjWeaverVersion = "1.9.22",
    selenideVersion = "7.16.1",
    restAssuredVersion = "5.3.0",
    allureVersion = "2.29.1",
    junitVersion = "5.10.2",
    slf4jVersion = "2.0.7"

allure {
    version.set("2.34.1")

    adapter {
        allureJavaVersion.set(allureVersion)
        aspectjVersion.set(aspectjWeaverVersion)
        aspectjWeaver.set(true)

        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation(
            "org.aspectj:aspectjweaver:$aspectjWeaverVersion",
            "com.codeborne:selenide-appium:$selenideVersion",
            "io.qameta.allure:allure-selenide:$allureVersion",
            "io.rest-assured:rest-assured:$restAssuredVersion",
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion",
            "org.aeonbits.owner:owner:1.0.12",
            "javax.annotation:javax.annotation-api:1.3.2"
    )
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}